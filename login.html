<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#F7F8FA"/>
  <title>Login – Smart Energy Meter</title>
  <meta name="description" content="Login to your Smart Energy Meter dashboard"/>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg"/>

  <!-- Global Theme -->
  <link rel="stylesheet" href="CSS/theme.css"/>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    /* ============================================================
       3D BACKGROUND & GLASSMORPHISM LAYOUT
    ============================================================ */
    body, html {
      overflow-x: hidden;
      background: #050d1a; 
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }

    /* 3D Floating Orbs for depth */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: floatOrbs 20s infinite alternate ease-in-out;
    }
    .orb-1 { width: 40vw; height: 40vw; background: #06B6D4; top: -10%; left: -5%; min-width: 300px; min-height: 300px; }
    .orb-2 { width: 50vw; height: 50vw; background: #10F5A0; bottom: -20%; right: -10%; min-width: 350px; min-height: 350px; animation-delay: -5s; }
    .orb-3 { width: 35vw; height: 35vw; background: #8B5CF6; top: 30%; left: 40%; min-width: 250px; min-height: 250px; animation-delay: -10s; }

    @keyframes floatOrbs {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 30px) scale(1.1); }
    }

    /* Main Centered Wrapper */
    .auth-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    /* The Glass Card */
    .glass-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 1000px;
      background: rgba(11, 17, 32, 0.45); 
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.05);
      overflow: hidden;
    }

    /* ============================================================
       LEFT PANEL – VISUAL (Hidden on Mobile/Tablet)
    ============================================================ */
    .auth-left {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 40px;
      background: rgba(6, 182, 212, 0.05); 
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .back-home {
      position: absolute; top: 25px; left: 25px;
      display: flex; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.7); text-decoration: none;
      font-size: 0.85rem; transition: color 0.3s ease; z-index: 5;
    }
    .back-home:hover { color: var(--primary); }

    .left-content { position: relative; z-index: 5; text-align: center; max-width: 420px; }
    .brand-logo-wrap { display: flex; justify-content: center; margin-bottom: 30px; }

    /* Central animated meter */
    .left-meter-wrap {
      position: relative; width: 220px; height: 220px; margin: 0 auto 30px;
      display: flex; align-items: center; justify-content: center;
    }
    .l-ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
    .l-ring-1 { width: 100%; height: 100%; border-top-color: var(--primary); border-right-color: var(--primary); animation: spin 4s linear infinite; }
    .l-ring-2 { width: 75%; height: 75%; border-bottom-color: var(--accent); border-left-color: var(--accent); animation: spin 3s linear infinite reverse; }
    .l-ring-3 { width: 55%; height: 55%; border-top-color: var(--amber); border-right-color: var(--amber); animation: spin 2s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .l-center {
      position: relative; z-index: 5; width: 45%; height: 45%;
      background: rgba(11, 17, 32, 0.6); backdrop-filter: blur(10px);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(6,182,212,0.5); box-shadow: 0 0 30px rgba(6,182,212,0.2);
    }

    .left-title { font-family: 'Orbitron', sans-serif; font-size: clamp(1.2rem, 2.5vw, 1.6rem); font-weight: 700; color: #fff; margin-bottom: 10px; }
    .left-title .highlight { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .left-desc { font-size: 0.85rem; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 25px; }

    .left-features { display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .left-feature-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md); padding: 8px 12px; font-size: 0.8rem;
      color: rgba(255,255,255,0.8); transition: all 0.3s ease;
    }

    /* ============================================================
       RIGHT PANEL – FORM
    ============================================================ */
    .auth-right {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 50px 40px; position: relative; width: 100%; box-sizing: border-box;
    }

    .form-container { width: 100%; max-width: 400px; position: relative; z-index: 2; }
    .mobile-brand { display: none; justify-content: center; margin-bottom: 20px; }

    .form-header { margin-bottom: 25px; text-align: left; }
    .form-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3);
      color: var(--primary); padding: 4px 12px; border-radius: 20px;
      font-size: 0.7rem; font-weight: 600; margin-bottom: 10px; text-transform: uppercase;
    }
    .form-tag-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    
    .form-title { font-family: 'Orbitron', sans-serif; font-size: clamp(1.3rem, 4vw, 1.8rem); font-weight: 700; margin-bottom: 5px; color: #fff; }
    .form-title span { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .form-subtitle { font-size: 0.85rem; color: rgba(255,255,255,0.6); }

    /* Google Button */
    .btn-google {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-md); color: #fff; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: 0.3s; margin-bottom: 20px;
    }
    .btn-google:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }
    .google-icon { width: 18px; height: 18px; }

    .or-divider { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .or-line { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
    .or-text { font-size: 0.7rem; color: rgba(255,255,255,0.5); text-transform: uppercase; }

    /* Inputs */
    .form-group { margin-bottom: 15px; position: relative; }
    .form-label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 500; color: rgba(255,255,255,0.8); margin-bottom: 5px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 12px; color: rgba(255,255,255,0.4); font-size: 0.85rem; z-index: 2; transition: 0.3s; }
    
    .form-input {
      width: 100%; padding: 10px 40px 10px 35px; box-sizing: border-box;
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md); color: #fff; font-size: 0.85rem; outline: none; transition: 0.3s;
    }
    .form-input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.08); }
    .form-group:focus-within .input-icon { color: var(--primary); }
    .password-toggle { position: absolute; right: 12px; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; z-index: 2; }
    
    .form-extras { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .remember-me input { display: none; }
    .custom-checkbox { width: 16px; height: 16px; border: 1.5px solid rgba(255,255,255,0.2); border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    .remember-me input:checked + .custom-checkbox { background: var(--primary); border-color: var(--primary); }
    .remember-me input:checked + .custom-checkbox::after { content: '✓'; font-size: 0.6rem; color: white; }
    .remember-label { font-size: 0.75rem; color: rgba(255,255,255,0.7); }
    .forgot-link { font-size: 0.75rem; color: var(--primary); text-decoration: none; }

    .btn-submit {
      width: 100%; padding: 12px; background: var(--gradient-primary); border: none; border-radius: var(--radius-md);
      color: #0B1120; font-size: 0.9rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: var(--glow-primary); }

    .form-switch { text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 15px; }
    .form-switch a { color: var(--primary); text-decoration: none; font-weight: 600; }

    /* ============================================================
       RESPONSIVE MEDIA QUERIES
    ============================================================ */
    /* Tablets (Hide left panel, center the card) */
    @media (max-width: 850px) {
      .glass-card { grid-template-columns: 1fr; max-width: 450px; }
      .auth-left { display: none; }
      .mobile-brand { display: flex; }
      .back-home { top: -30px; left: 0; font-size: 0.8rem; }
      .auth-wrapper { padding-top: 60px; } /* Space for back button */
    }

    /* Small Mobile Phones */
    @media (max-width: 480px) {
      .auth-wrapper { padding: 15px; }
      .glass-card { border-radius: 20px; }
      .auth-right { padding: 30px 20px; }
      .form-title { font-size: 1.4rem; }
      .btn-google, .btn-submit, .form-input { padding: 10px; font-size: 0.8rem; }
      .form-extras { flex-direction: row; justify-content: space-between; }
    }
  </style>
  <!-- Human-designed V2 visual system -->
  <link rel="stylesheet" href="CSS/v2.css"/>
</head>

<body>

  <!-- 3D ORB BACKGROUND -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- MAIN WRAPPER -->
  <div class="auth-wrapper">
    <div class="glass-card">

      <!-- LEFT PANEL (Only visible on Desktop) -->
      <div class="auth-left">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="left-content">
          <div class="brand-logo-wrap" data-logo="full" data-height="35"></div>
          <div class="left-meter-wrap">
            <div class="l-ring l-ring-1"></div>
            <div class="l-ring l-ring-2"></div>
            <div class="l-ring l-ring-3"></div>
            <div class="l-center" data-logo="icon" data-size="50"></div>
          </div>
          <h2 class="left-title">Welcome <span class="highlight">Back!</span></h2>
          <p class="left-desc">Login to access your real-time energy dashboard and monitor live readings.</p>
        </div>
      </div>

      <!-- RIGHT PANEL (FORM - Visible on all devices) -->
      <div class="auth-right">
        <!-- Back button visible only on mobile -->
        <a href="index.html" class="back-home" style="display: none;"><i class="fas fa-arrow-left"></i> Back</a>

        <div class="form-container">
          <div class="mobile-brand" data-logo="full" data-height="35"></div>

          <div class="form-header">
            <div class="form-tag"><span class="form-tag-dot"></span> Secure Login</div>
            <h1 class="form-title">Sign In to <span>Dashboard</span></h1>
            <p class="form-subtitle">Access your smart energy system</p>
          </div>

          <button class="btn-google" onclick="googleLogin()">
            <svg class="google-icon" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
          </button>

          <div class="or-divider"><div class="or-line"></div><span class="or-text">or</span><div class="or-line"></div></div>

          <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
            <div class="form-group">
              <label class="form-label" for="email"><i class="fas fa-envelope"></i> Email</label>
              <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" class="form-input" id="email" placeholder="your@email.com" required/>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="password"><i class="fas fa-lock"></i> Password</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" class="form-input" id="password" placeholder="Enter password" required/>
                <button type="button" class="password-toggle" onclick="togglePassword('password','eyeIcon')"><i class="fas fa-eye" id="eyeIcon"></i></button>
              </div>
            </div>

            <div class="form-extras">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe" checked/>
                <div class="custom-checkbox"></div>
                <span class="remember-label">Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">
              <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
          </form>

          <p class="form-switch">Don't have an account? <a href="signup.html">Create Account</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/logo.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, setPersistence, browserLocalPersistence, browserSessionPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCm4144uYkh7f2Kx8hxlqqMUjYs4sudmDA",
      authDomain: "smartenergymeter-dd01b.firebaseapp.com",
      databaseURL: "https://smartenergymeter-dd01b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "smartenergymeter-dd01b",
      storageBucket: "smartenergymeter-dd01b.firebasestorage.app",
      messagingSenderId: "299635627523",
      appId: "1:299635627523:web:fd8375e25803015e0de036"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    // Keep Firebase session available so returning users are signed in automatically.
    // The checkbox still controls whether the email/password session survives browser restarts.
    setPersistence(auth, browserLocalPersistence).catch(() => {});

    // Complete Google redirect login when popup/redirect flow returns to this page.
    getRedirectResult(auth).catch(() => {});

    // AUTO LOGIN LOGIC
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.replace('dashboard.html');
    });

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      document.getElementById('loginBtn').textContent = 'Signing In...';
      try {
        await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        document.getElementById('loginBtn').innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        alert('Error: ' + err.message);
      }
    };

    window.googleLogin = async function() {
      const btn = document.querySelector('.btn-google');
      if (btn) { btn.disabled = true; btn.classList.add('is-loading'); }
      try {
        await setPersistence(auth, browserLocalPersistence);
        // Popup is fastest on desktop. If the browser blocks it, use Firebase redirect.
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
          try { await signInWithRedirect(auth, provider); return; } catch (redirectErr) { err = redirectErr; }
        }
        if (btn) { btn.disabled = false; btn.classList.remove('is-loading'); }
        alert('Google sign-in failed: ' + (err.message || 'Please try again.'));
      }
    };
  </script>
  <script>
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId), icon = document.getElementById(iconId);
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    }
    // Make mobile back button visible
    if(window.innerWidth <= 850) { document.querySelector('.auth-right .back-home').style.display = 'flex'; }
  </script>
</body>
</html>
