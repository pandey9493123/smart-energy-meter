<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none" role="img" aria-label="Smart Energy Meter Icon">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10F5A0"/>
    </linearGradient>

    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10F5A0" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="2" y="2" width="46" height="46" rx="12" fill="url(#iconBg)"/>

  <!-- Outer hexagon -->
  <path d="M25 5 L42 13 L42 37 L25 45 L8 37 L8 13 Z"
        fill="none"
        stroke="url(#iconGrad)"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#iconGlow)"/>

  <!-- Lightning bolt -->
  <path d="M27 13 L18 27 L24 27 L22 37 L32 23 L26 23 Z"
        fill="url(#iconGrad)"
        stroke="url(#iconGrad)"
        stroke-width="0.5"
        stroke-linejoin="round"
        filter="url(#iconGlow)"/>

  <!-- Corner dots -->
  <circle cx="25" cy="5"  r="1.5" fill="#10F5A0"/>
  <circle cx="42" cy="13" r="1.5" fill="#06B6D4"/>
  <circle cx="42" cy="37" r="1.5" fill="#10F5A0"/>
  <circle cx="25" cy="45" r="1.5" fill="#06B6D4"/>
  <circle cx="8"  cy="37" r="1.5" fill="#10F5A0"/>
  <circle cx="8"  cy="13" r="1.5" fill="#06B6D4"/>
</svg>