<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none" role="img" aria-label="Smart Energy Meter">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10F5A0"/>
    </linearGradient>

    <linearGradient id="logoGradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10F5A0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: Hexagon with Lightning Bolt -->
  <g transform="translate(5, 5)">
    <!-- Outer hexagon -->
    <path d="M25 2 L44 12 L44 38 L25 48 L6 38 L6 12 Z"
          fill="none"
          stroke="url(#logoGrad)"
          stroke-width="2.5"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Inner hexagon (subtle) -->
    <path d="M25 8 L39 15 L39 33 L25 40 L11 33 L11 15 Z"
          fill="url(#logoGrad)"
          opacity="0.08"/>

    <!-- Lightning bolt -->
    <path d="M27 12 L18 27 L24 27 L22 38 L32 22 L26 22 Z"
          fill="url(#logoGrad)"
          stroke="url(#logoGrad)"
          stroke-width="0.5"
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Corner accent dots -->
    <circle cx="25" cy="2"  r="1.5" fill="#10F5A0"/>
    <circle cx="44" cy="12" r="1.5" fill="#06B6D4"/>
    <circle cx="44" cy="38" r="1.5" fill="#10F5A0"/>
    <circle cx="25" cy="48" r="1.5" fill="#06B6D4"/>
    <circle cx="6"  cy="38" r="1.5" fill="#10F5A0"/>
    <circle cx="6"  cy="12" r="1.5" fill="#06B6D4"/>
  </g>

  <!-- Text: SMART ENERGY -->
  <text x="65" y="27"
        font-family="'Orbitron', sans-serif"
        font-size="16"
        font-weight="800"
        fill="url(#logoGradText)"
        letter-spacing="1.5">SMART ENERGY</text>

  <!-- Text: METER -->
  <text x="65" y="45"
        font-family="'Poppins', sans-serif"
        font-size="10"
        font-weight="500"
        fill="currentColor"
        opacity="0.7"
        letter-spacing="4">METER SYSTEM</text>

  <!-- Underline accent -->
  <rect x="65" y="49" width="30" height="1.5" fill="url(#logoGrad)" rx="1"/>
</svg>